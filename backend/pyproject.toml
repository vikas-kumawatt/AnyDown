[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    # asyncio's subprocess transport finalises after pytest-asyncio has already
    # closed the loop. A teardown artifact of the test runner, not the app.
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 90
target-version = "py311"
