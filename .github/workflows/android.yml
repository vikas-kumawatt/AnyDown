name: Android APK

# Builds an installable debug APK on every push, so you never need Android
# Studio locally. Download it from the run's Artifacts section, or from the
# Releases page when you push a tag.
on:
  push:
    # No `paths` filter here. Combining it with `tags` in a single push trigger
    # is unreliable: a tag push often carries no file diff for the filter to
    # match, so the release build silently never runs. A 2.5 minute build on
    # every push to main is a better trade than a release that doesn't happen.
    branches: [main, master]
    tags: ['v*']
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No Gradle wrapper is committed (a wrapper JAR is a binary blob), so
      # Gradle is provided by the action instead. Locally, run `gradle wrapper`
      # once if you want ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The pure-Kotlin domain logic — format planning, the platform allow-list,
      # filename sanitising, error classification — is covered here. This is the
      # gate: if the rules regress, the APK doesn't get built.
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon

      # Per-ABI APKs plus a universal one. arm64-v8a is the one you want for any
      # phone made in roughly the last eight years.
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: anydown-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Release builds are minified and signed with your own key, so each one
      # installs as an update over the last. The key comes from four repository
      # secrets (see android/README.md). A version tag without them fails
      # loudly; a manual run without them just skips the release build.
      - name: Decode signing key
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 isn't set, so the release APK can't be signed. See android/README.md."
              exit 1
            fi
            echo "::notice::No signing key in secrets; skipping the release build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Assemble release APK
        if: env.ANDROID_KEYSTORE_PATH != ''
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Upload release APKs
        if: env.ANDROID_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: anydown-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Maps shrunk class names back to real ones. A release-only crash reports
      # names like "Q2.e"; this file is how to read them.
      - name: Upload R8 mapping
        if: env.ANDROID_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: anydown-release-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Attach APKs to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
