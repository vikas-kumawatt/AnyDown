name: Backend → Azure

# Builds the backend's Docker image, pushes it to GitHub's container registry
# and rolls it out to the Azure Container App that deploy/azure-setup.sh
# created. Runs on every push to main that touches the backend, or by hand.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-azure.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Never two rollouts at once; a newer push waits for the one in flight.
concurrency:
  group: backend-azure
  cancel-in-progress: false

env:
  RESOURCE_GROUP: anydown
  APP_NAME: anydown-api

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for the Azure credential
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -z "$AZURE_CREDENTIALS" ]; then
            echo "::error::The AZURE_CREDENTIALS secret isn't set. Run deploy/azure-setup.sh in Azure Cloud Shell first; see README.md."
            exit 1
          fi
          # Registry paths must be lowercase.
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/anydown-api" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Azure pulls the image anonymously, every time the app scales up from
      # zero. GitHub makes new packages private, so the first deploy stops here
      # until it's made public once, rather than rolling out a revision that
      # can't start.
      - name: Check the image is publicly pullable
        run: |
          repo="${IMAGE#ghcr.io/}"
          # A private package refuses the anonymous token itself (403), so
          # don't let that kill the step before it can say what to do.
          token="$(curl -sS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r '.token // empty' || true)"
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${repo}/manifests/${GITHUB_SHA}")"
          if [ "$status" != "200" ]; then
            echo "::error::Azure can't pull ${IMAGE} (HTTP ${status}). Make the package public once: ${GITHUB_SERVER_URL}/users/${GITHUB_REPOSITORY_OWNER}/packages/container/package/anydown-api/settings → Change visibility → Public. Then re-run this workflow."
            exit 1
          fi

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Roll out
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          # The setup script starts the app on a placeholder that listens on 80.
          az containerapp ingress update -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --target-port 8000 --output none
          az containerapp update -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --image "${IMAGE}:${GITHUB_SHA}" --output none
          fqdn="$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)"
          echo "URL=https://${fqdn}" >> "$GITHUB_ENV"

      # The app scales to zero, so allow for a cold start.
      - name: Health check
        run: |
          for attempt in $(seq 1 12); do
            if body="$(curl -fsS --max-time 20 "${URL}/api/health")"; then
              echo "$body"
              echo "### Backend deployed: ${URL}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "not answering yet (attempt ${attempt}); waiting"
            sleep 10
          done
          echo "::error::${URL}/api/health never answered. Logs: az containerapp logs show -n ${APP_NAME} -g ${RESOURCE_GROUP} --follow"
          exit 1
