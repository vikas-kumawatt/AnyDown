# Set the site's Base directory to `frontend` in Netlify's UI; this file lives
# there, and `publish` is relative to it. (It used to repeat `base` and point at
# frontend/dist, which Netlify resolves to frontend/frontend/dist.)
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # Keep this personal tool out of search indexes (PRD section 13).
    X-Robots-Tag = "noindex, nofollow"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
