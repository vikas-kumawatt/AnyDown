# Set the site's Base directory to `frontend` in Netlify's UI; this file lives
# there, and `publish` is relative to it. (It used to repeat `base` and point at
# frontend/dist, which Netlify resolves to frontend/frontend/dist.)
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # VITE_APP_KEY is public by design: the browser sends it with every request,
  # so Vite has to put it in the bundle. It keeps strangers off the API, it
  # doesn't hide anything from visitors. Netlify's secret scanner sees a
  # "secret" env var in the build output and fails the deploy; tell it this
  # one is expected. Every other variable is still scanned.
  SECRETS_SCAN_OMIT_KEYS = "VITE_APP_KEY"

# SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # Keep this personal tool out of search indexes (PRD section 13).
    X-Robots-Tag = "noindex, nofollow"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
